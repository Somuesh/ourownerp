# Render Blueprint for Our ERP: Postgres + API (Express) + web (Vite static site).
# Service names decide the public URLs (https://<name>.onrender.com). If a name is
# taken Render adds a suffix — then update VITE_API_URL / APP_URL / the OIDC
# redirect URI below to match, and redeploy the web service.
databases:
  - name: our-erp-db
    plan: free
    databaseName: ourerp
    user: ourerp

services:
  - type: web
    name: our-erp-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --prod=false
    # Applies the schema to the database before each deploy goes live.
    preDeployCommand: corepack enable && pnpm db:push --force
    startCommand: corepack enable && pnpm start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: our-erp-db
          property: connectionString
      - key: DEV_AUTH_BYPASS
        value: "false"
      - key: APP_URL
        value: https://our-erp-web.onrender.com
      - key: OIDC_AUTHORITY
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      # Optional: email (invites, invoices) and voice AI providers.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: our-erp-web
    runtime: static
    buildCommand: corepack enable && pnpm install --prod=false && pnpm exec vite build
    staticPublishPath: dist
    routes:
      # Single-page app: send every path to index.html so /auth/callback etc. work.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        value: https://our-erp-api.onrender.com
      - key: VITE_OIDC_AUTHORITY
        sync: false
      - key: VITE_OIDC_CLIENT_ID
        sync: false
      # Only needed for Google (see DEPLOY.md note on client secrets).
      - key: VITE_OIDC_CLIENT_SECRET
        sync: false
