# Render Blueprint for Our ERP: Postgres + ONE web service that runs the Express API
# and also serves the built React app (same origin, so no CORS or separate static site).
# The service name decides the public URL (https://<name>.onrender.com). If the name
# is taken Render adds a suffix — then update VITE_API_URL / APP_URL and the OIDC
# redirect URI to match, and redeploy.
databases:
  - name: our-erp-db
    plan: free
    databaseName: ourerp
    user: ourerp

services:
  - type: web
    name: our-erp-api
    runtime: node
    plan: free
    # Installs everything, then builds the frontend into dist/ (VITE_* are read here).
    buildCommand: corepack enable && pnpm install --prod=false && pnpm exec vite build
    # Free tier has no pre-deploy command, so the schema is applied on every start.
    startCommand: corepack enable && pnpm db:push --force && pnpm start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: DATABASE_URL
        fromDatabase:
          name: our-erp-db
          property: connectionString
      - key: DEV_AUTH_BYPASS
        value: "false"
      - key: APP_URL
        value: https://our-erp-api.onrender.com
      - key: VITE_API_URL
        value: https://our-erp-api.onrender.com
      - key: OIDC_AUTHORITY
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: VITE_OIDC_AUTHORITY
        sync: false
      - key: VITE_OIDC_CLIENT_ID
        sync: false
      # Only needed for Google (see DEPLOY.md note on client secrets).
      - key: VITE_OIDC_CLIENT_SECRET
        sync: false
      # Optional: email (invites, invoices) and voice AI providers.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
